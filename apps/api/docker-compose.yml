services:
  postgres:
    image: postgres:16.13-alpine
    container_name: spotfix-community-postgres
    environment:
      POSTGRES_USER: spotfix
      POSTGRES_PASSWORD: spotfix
      POSTGRES_DB: spotfix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotfix -d spotfix"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: spotfix-community-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: spotfix
      MINIO_ROOT_PASSWORD: spotfix-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 spotfix spotfix-dev-secret &&
        mc mb --ignore-existing local/spotfix-photos &&
        echo 'minio bucket ready'
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotfix-community-api
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DATABASE_URL: postgresql://spotfix:spotfix@postgres:5432/spotfix?schema=public
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: spotfix-photos
      STORAGE_ACCESS_KEY: spotfix
      STORAGE_SECRET_KEY: spotfix-dev-secret
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotfix-community-api-dev
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      DATABASE_URL: postgresql://spotfix:spotfix@postgres:5432/spotfix?schema=public
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: spotfix-photos
      STORAGE_ACCESS_KEY: spotfix
      STORAGE_SECRET_KEY: spotfix-dev-secret
      STORAGE_FORCE_PATH_STYLE: "true"
      NODE_ENV: development
    command: ["npm", "run", "dev"]
    ports:
      - "5001:5001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  api_node_modules: